[workspace]
resolver = "2"
members = [
    "crates/spec",
    "crates/spec-loader",
    "crates/kalman",
    "crates/gamma-poisson",
    "crates/ekf-bearing",
    "crates/autodiff",
    "crates/riccati",
    "crates/partial-eval",
    "crates/codegen",
    "crates/codegen-demo",
    "crates/embedded",
    "crates/end-to-end",
    "xtask",
]
default-members = [
    "crates/spec",
    "crates/spec-loader",
    "crates/kalman",
    "crates/gamma-poisson",
    "crates/ekf-bearing",
    "crates/autodiff",
    "crates/riccati",
    "crates/partial-eval",
    "crates/codegen",
    "crates/codegen-demo",
    "crates/end-to-end",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }
serde = { version = "1", default-features = false, features = ["derive"] }
ron = "0.8"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
num-dual = { version = "0.10", default-features = false, features = ["linalg"] }

# Aggressive inlining + LTO is what carries the macro-emitted straight-line
# arithmetic through to the binary. Without these, unrolling can collapse back
# into loops or non-inlined calls, which then re-introduces input-dependent
# timing in the cycle-counting demo.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
