[package]
name = "embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lab 5: no_std cortex-m-rt binary, runs in QEMU lm3s6965evb. Embassy wired in later."
build = "build.rs"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-halt = "0.2"
codegen-demo = { path = "../codegen-demo" }

# Optional contrast build. When `naive-baseline` is enabled the runtime-nalgebra
# `KalmanFilter<f32, 4, 2>` runs alongside `Filter4x2` on the same trace, so the
# two cycle-count series can be compared. Off by default so the headline build
# stays clean and `just verify`'s `no nalgebra in MCU dep tree` check passes.
kalman = { path = "../kalman", optional = true }
nalgebra = { workspace = true, optional = true }

[features]
default = []
naive-baseline = ["dep:kalman", "dep:nalgebra"]

# Embassy goes here once the bare-metal entrypoint boots:
#   embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
#   embassy-time = { version = "0.3", features = ["tick-hz-1_000_000"] }
